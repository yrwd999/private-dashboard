name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff black

      - name: Run ruff
        run: ruff check scripts/

      - name: Run black check
        run: black --check scripts/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run LCM exporter tests
        run: python3 scripts/lcm/tests/test_exporter.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security scan
        run: python3 scripts/security_scan.py || true

  js-syntax:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax
        run: |
          # Syntax check all JS files (node --check validates without running)
          find docs/ -name "*.js" -print0 | while IFS= read -r -d '' f; do
            node --check "$f" || echo "SYNTAX ERROR: $f"
          done
