<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Dashboard · yrwd999</title>
  <meta name="description" content="Aggregated dashboard for LCM memory + future private services. Static site, data-only.">
  <style>
    /* Design Tokens — 复用 docs/DESIGN_TOKENS.md */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f7;
      --fg-primary: #1d1d1f;
      --fg-secondary: #6e6e73;
      --fg-tertiary: #86868b;
      --accent-blue: #0071e3;
      --accent-green: #30d158;
      --accent-orange: #ff9f0a;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
      --radius-lg: 18px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --space-6: 48px;
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg-secondary);
      color: var(--fg-primary);
      line-height: 1.6;
      min-height: 100vh;
      padding: var(--space-6) var(--space-4);
    }
    .container {
      max-width: 1060px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: var(--space-6);
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg-primary);
      margin-bottom: var(--space-2);
    }
    .header .subtitle {
      font-size: 20px;
      color: var(--fg-secondary);
      font-weight: 400;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
      text-decoration: none;
      color: inherit;
      transition: transform 300ms cubic-bezier(0, 0, 0.2, 1),
                  box-shadow 300ms cubic-bezier(0, 0, 0.2, 1);
      display: block;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .card .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: var(--space-3);
    }
    .badge.dev { background: rgba(255, 159, 10, 0.12); color: #ff9f0a; }
    .badge.live { background: rgba(48, 209, 88, 0.12); color: #30a158; }
    .badge.empty { background: rgba(0, 0, 0, 0.06); color: var(--fg-tertiary); }
    .card h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: var(--space-2);
    }
    .card .desc {
      font-size: 14px;
      color: var(--fg-secondary);
      margin-bottom: var(--space-3);
    }
    .card .meta {
      font-size: 12px;
      color: var(--fg-tertiary);
      display: flex;
      gap: var(--space-3);
    }
    .footer {
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--fg-tertiary);
      text-align: center;
    }
    @media (max-width: 768px) {
      .header h1 { font-size: 40px; }
      .header .subtitle { font-size: 16px; }
      body { padding: var(--space-4) var(--space-3); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Private Dashboard</h1>
      <p class="subtitle">聚合统计仪表板 · 仅导出脱敏数据，零凭据 · GitHub Pages</p>
    </header>

    <div class="grid">
      <a href="./lcm/" class="card">
        <span class="badge dev">开发中</span>
        <h2>LCM Memory</h2>
        <p class="desc">Lossless-Claw 记忆系统的健康指标、消息趋势、会话分布。每日 02:00 自动刷新。</p>
        <div class="meta">
          <span>📊 4 核心指标</span>
          <span>📈 30 天趋势</span>
          <span>🔄 每日更新</span>
        </div>
      </a>

      <div class="card" style="opacity: 0.55; cursor: not-allowed;">
        <span class="badge empty">预留</span>
        <h2>Homelab</h2>
        <p class="desc">家庭实验室设备状态、HA 集成健康度。规划中。</p>
        <div class="meta">
          <span>🚧 等待调研</span>
        </div>
      </div>

      <div class="card" style="opacity: 0.55; cursor: not-allowed;">
        <span class="badge empty">预留</span>
        <h2>Network</h2>
        <p class="desc">OpenWrt 路由器 / NAS / 内网服务监控。规划中。</p>
        <div class="meta">
          <span>🚧 等待调研</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>最后更新：2026-06-24 · 由 <a href="https://github.com/yrwd999" style="color: var(--accent-blue); text-decoration: none;">yrwd999</a> 维护</p>
      <p style="margin-top: 8px;">
        <a href="https://github.com/yrwd999/private-dashboard" style="color: var(--accent-blue); text-decoration: none;">查看 GitHub 仓库</a>
        ·
        <a href="./docs/DASHBOARD_REGISTRY.md" style="color: var(--accent-blue); text-decoration: none;">模块清单</a>
      </p>
    </div>
  </div>
</body>
</html>
